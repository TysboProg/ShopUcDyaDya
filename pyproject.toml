[project]
name = "shopucdyadya"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.2",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "fastapi-redis-sdk>=0.8.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "ruff==0.16.6",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
    "taskiq>=0.12.6",
    "taskiq-aio-pika>=0.6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopucdyadya"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ANN",
    "W",   # pycodestyle warnings
    "PT",  # flake8-pytest-style (специальные проверки для pytest!)
]

[tool.ruff.lint.per-file-ignores]
# Игнорируем определенные правила только для папки tests
"tests/*" = [
    "S101",   # Разрешить использование assert (в проде нельзя, в тестах нужно)
    "ARG001", # Разрешить неиспользуемые аргументы в функциях (фикстуры pytest)
    "SLF001", # Разрешить доступ к защищенным переменным (_private) в тестах
    "ANN", # Разрешить отсутствие аннотаций типов в тестах
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

show_error_codes = true
pretty = true

warn_unreachable = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true

enable_error_code = [
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "shopucdyadya.migrations.*"
disallow_untyped_calls = false
warn_unreachable = false

[[tool.mypy.overrides]]
module = "tests.*"
# Не требовать аннотации типов аргументов и возвращаемых значений для тестов
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Разрешить untyped фикстуры
check_untyped_defs = true
